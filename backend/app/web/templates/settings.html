{% extends "base.html" %}
{% block content %}
<h1>Settings</h1>
<section>
  <h2>Seller Accounts</h2>
  <form method="post" action="/api/settings/seller-accounts">
    <label>Display name <input name="display_name"></label>
    <label>Amazon seller ID <input name="amazon_seller_id"></label>
    <button type="submit">Save Seller Account</button>
  </form>
</section>
<section>
  <h2>Marketplaces</h2>
  <form method="post" action="/api/settings/marketplaces">
    <label>Seller account <input name="seller_account_id" inputmode="numeric"></label>
    <label>Marketplace ID <input name="marketplace_id"></label>
    <label>Region <input name="region" value="americas"></label>
    <label>Country code <input name="country_code" value="US"></label>
    <label>Timezone <input name="timezone" value="America/Los_Angeles"></label>
    <label>Currency code <input name="currency_code" value="USD"></label>
    <button type="submit">Save Marketplace</button>
  </form>
</section>
<section>
  <h2>LLM Settings</h2>
  <form>
    <label>Base URL <input name="llm_base_url" value="https://api.openai.com/v1"></label>
    <label>Model <input name="llm_model" value="gpt-4.1-mini"></label>
    <label>API key <input name="llm_api_key" type="password"></label>
    <button type="button">Save LLM Settings</button>
  </form>
</section>
{% endblock %}
