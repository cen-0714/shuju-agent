{% extends "base.html" %}
{% block content %}
<h1>Data Import</h1>
<form method="post" action="/api/imports/preview" enctype="multipart/form-data">
  <fieldset>
    <legend>Store</legend>
    <label>店铺/市场 <select name="store_option" id="store-option"></select></label>
    <input type="hidden" name="seller_account_id" id="seller-account-id">
    <input type="hidden" name="marketplace_id" id="marketplace-id">
  </fieldset>
  <fieldset>
    <legend>Report type</legend>
    <select name="report_type">
      <option value="business_report">Business Report</option>
      <option value="inventory_report">Inventory Report</option>
      <option value="ads_search_term_report">Ads Search Term Report</option>
    </select>
  </fieldset>
  <label>Start date <input name="date_range_start" type="date"></label>
  <label>End date <input name="date_range_end" type="date"></label>
  <label>File <input name="file" type="file"></label>
  <div class="actions">
    <button type="submit">Preview</button>
    <button type="submit" formaction="/api/imports/confirm">Confirm Import</button>
  </div>
</form>
<section>
  <h2>Import History</h2>
  <table>
    <thead>
      <tr><th>File</th><th>Store</th><th>Report type</th><th>Status</th><th>Delete</th></tr>
    </thead>
    <tbody>
      <tr><td colspan="5">No imports yet.</td></tr>
    </tbody>
  </table>
</section>
<script>
async function loadStoreOptions() {
  const response = await fetch("/api/settings/store-options");
  const stores = await response.json();
  const select = document.getElementById("store-option");
  select.innerHTML = stores.map((item) =>
    `<option value="${item.seller_account_id}:${item.marketplace_id}">${item.label}</option>`
  ).join("");
  syncStoreHiddenFields();
}
function syncStoreHiddenFields() {
  const value = document.getElementById("store-option").value;
  if (!value) return;
  const [sellerAccountId, marketplaceId] = value.split(":");
  document.getElementById("seller-account-id").value = sellerAccountId;
  document.getElementById("marketplace-id").value = marketplaceId;
}
document.getElementById("store-option").addEventListener("change", syncStoreHiddenFields);
document.querySelector("form").addEventListener("submit", syncStoreHiddenFields);
loadStoreOptions();
</script>
{% endblock %}
