{% extends "base.html" %}
{% block content %}
<h1>Report Center</h1>
<form id="report-generate-form">
  <fieldset>
    <legend>Scope</legend>
    <label><input type="radio" name="scope_type" value="all_stores" checked> All stores</label>
    <label><input type="radio" name="scope_type" value="single_store"> Single store</label>
    <label>店铺/市场 <select name="store_option" id="store-option"></select></label>
    <input type="hidden" name="seller_account_id" id="seller-account-id">
    <input type="hidden" name="marketplace_id" id="marketplace-id">
  </fieldset>
  <fieldset>
    <legend>Data source</legend>
    <label><input type="radio" name="data_source" value="orders" checked> 订单 (Orders)</label>
    <label><input type="radio" name="data_source" value="business"> 销售流量 (Sales &amp; Traffic)</label>
  </fieldset>
  <fieldset>
    <legend>Report kind</legend>
    <label><input type="radio" name="report_kind" value="single_day" checked> Single day</label>
    <label><input type="radio" name="report_kind" value="date_range"> Date range</label>
  </fieldset>
  <label>Start date <input name="report_start_date" type="date"></label>
  <label>End date <input name="report_end_date" type="date"></label>
  <div class="actions">
    <button type="submit">Generate Report</button>
    <button type="button" class="secondary">Download Excel</button>
  </div>
  <p id="report-message" role="status"></p>
</form>
<section>
  <h2>Generated Reports</h2>
  <table>
    <thead>
      <tr><th>Date range</th><th>Scope</th><th>Status</th><th>Markdown</th><th>Excel</th></tr>
    </thead>
    <tbody>
      <tr><td colspan="5">No reports yet.</td></tr>
    </tbody>
  </table>
</section>
<script>
async function loadStoreOptions() {
  const response = await fetch("/api/settings/store-options");
  const stores = await response.json();
  const select = document.getElementById("store-option");
  select.innerHTML = stores.map((item) =>
    `<option value="${item.seller_account_id}:${item.marketplace_id}">${item.label}</option>`
  ).join("");
  syncStoreHiddenFields();
}
function syncStoreHiddenFields() {
  const value = document.getElementById("store-option").value;
  if (!value) return;
  const [sellerAccountId, marketplaceId] = value.split(":");
  document.getElementById("seller-account-id").value = sellerAccountId;
  document.getElementById("marketplace-id").value = marketplaceId;
}
document.getElementById("store-option").addEventListener("change", syncStoreHiddenFields);
document.getElementById("report-generate-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  syncStoreHiddenFields();
  const form = new FormData(event.target);
  const scopeType = form.get("scope_type");
  const payload = {
    scope_type: scopeType,
    report_kind: form.get("report_kind"),
    data_source: form.get("data_source"),
    report_start_date: form.get("report_start_date"),
    report_end_date: form.get("report_end_date"),
    seller_account_id: scopeType === "single_store" ? Number(form.get("seller_account_id")) : null,
    marketplace_id: scopeType === "single_store" ? Number(form.get("marketplace_id")) : null,
  };
  const response = await fetch("/api/reports/generate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload),
  });
  const result = await response.json().catch(() => ({}));
  document.getElementById("report-message").textContent = response.ok
    ? `报告已生成：#${result.id}`
    : (result.detail || "报告生成失败");
});
loadStoreOptions();
</script>
{% endblock %}
